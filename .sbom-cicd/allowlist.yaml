    package: stdlib
    reason: "Same as GO-2026-6604: Go stdlib net/http issue inside upstream scanner binaries; fixed in Go 1.26.9, upstream binaries not yet rebuilt."
    approved_by: "Ivan Lin — decision recorded 2026-10-15 (job 0f739cd4 turn 2): keep the exemption until its expiry; re-evaluate on every tools.lock bump (syft/grype 1.54.1/0.120.1 are the latest upstream releases, yq 4.54.1 still built with go1.27.1)"
