# Reusable SBOM + CVE gate. Call it from any repo:
#   jobs:
#     gate:
#       uses: ivanlin/sbom-cicd-toolkit/.github/workflows/scan.yml@v1.3.0
#       with:
#         name: my-project
#         source: .
#         fail_on: HIGH
#         toolkit_image: ghcr.io/ivanlin/sbom-cicd-toolkit@sha256:<digest from the release notes>
#
# The workflow only adapts GitHub to the toolkit container (RQ12/RQ13): pull by digest ->
# verify-toolkit (signature against the trusted keys baked into the image) -> scan -> upload.
# The container reads no GitHub variables; commit + remote URL are passed as CLI arguments.
# Pass toolkit_image explicitly: a tagged copy of this file cannot contain the digest of the image
# built from that same tag, so the default below is only a placeholder that fails loudly.
#
# Enforcement: CI always ENFORCES — every non-zero exit fails the job. Since 1.3.0 the code says
# why (`sbomgate exit-codes`): 2 CVEs at or above fail_on · 3 an external resource (registry,
# vulnerability DB) could not be got · 4 untrusted (signature / tools.lock / evidence) ·
# 5 policy error (allowlist, trusted keys, threshold) · 64 usage · 1 anything else. The sssf factory's LOCAL supply-chain node has its own, independent switch
# (defaults.supply_chain.enforcement: off | advisory | enforce, plus on_unavailable: block | degrade
# under enforce). Local commits carrying a "Supply-Chain: advisory …", "… off" or "… degraded"
# trailer were not gated on the developer machine — this job is where they get scanned for real.
# There is deliberately no advisory or degrade option here: if the runner cannot reach the
# registry or a vulnerability DB, re-run the job; do not weaken it.
name: sbom-cve-gate (reusable)
on:
  workflow_call:
    inputs:
      name:
        type: string
        required: true
        description: "SBOM / artifact name"
      source:
        type: string
        default: "."
        description: "directory to scan, repo-relative"
      fail_on:
        type: string
        default: "HIGH"
        description: "CRITICAL | HIGH | MEDIUM | LOW | none — default HIGH; the project policy floor is HIGH (CRITICAL findings must be fixed, not exempted)"
      only_fixed:
        type: boolean
        default: false
      toolkit_image:
        type: string
        # get it with: docker buildx imagetools inspect ghcr.io/ivanlin/sbom-cicd-toolkit:1.3.0
        default: "ghcr.io/ivanlin/sbom-cicd-toolkit@sha256:<fill-from-release>"
        description: "toolkit image pinned by digest (image@sha256:...); a tag-only ref is refused"
    outputs:
      result:
        value: ${{ jobs.gate.outputs.result }}
      toolkit_digest:
        value: ${{ jobs.gate.outputs.digest }}
jobs:
  gate:
    runs-on: ubuntu-latest
    # No `permissions:` block on purpose: a called workflow may not ask for more than its caller
    # grants, and the toolkit image is public, so neither packages:read nor a registry login is needed.
    outputs:
      result: ${{ steps.scan.outputs.result }}
      digest: ${{ steps.pull.outputs.digest }}
    env:
      TOOLKIT: ${{ inputs.toolkit_image }}
      GATE_NAME: ${{ inputs.name }}
      GATE_SOURCE: ${{ inputs.source }}
      GATE_FAIL_ON: ${{ inputs.fail_on }}
      GATE_ONLY_FIXED: ${{ inputs.only_fixed }}
    steps:
      - uses: actions/checkout@v4
      - id: pull
        name: Pull the toolkit image by digest
        run: |
          case "$TOOLKIT" in
            *'<'*)      echo "::error::toolkit_image still holds the placeholder; pass toolkit_image: ghcr.io/ivanlin/sbom-cicd-toolkit@sha256:<digest> (see the release notes)"; exit 1;;
            *@sha256:*) ;;
            *)          echo "::error::toolkit_image must be pinned by digest (image@sha256:...), got: $TOOLKIT"; exit 1;;
          esac
          docker pull "$TOOLKIT"
          echo "digest=$TOOLKIT" | tee -a "$GITHUB_OUTPUT"
      - name: Verify the toolkit image signature (trusted keys, no provider API)
        run: |
          docker run --rm "$TOOLKIT" verify-toolkit --image "$TOOLKIT" || {
            echo "::error::toolkit image signature NOT verified against the trusted keys - refusing to scan (verify-toolkit exit 3 = registry unreachable, 4 = untrusted; do not 'fix' the code)"
            exit 1; }
      - id: scan
        name: SBOM (CycloneDX+SPDX) + CVE scan (grype, trivy) + gate
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          extra=""; [ "$GATE_ONLY_FIXED" = "true" ] && extra="--only-fixed"
          set +e
          docker run --rm -e SBOMGATE_IMAGE_DIGEST="$TOOLKIT" \
            -v "$GITHUB_WORKSPACE:/src:ro" -v "$RUNNER_TEMP/out:/out" "$TOOLKIT" \
            scan --source "/src/$GATE_SOURCE" --name "$GATE_NAME" --out /out \
                 --fail-on "$GATE_FAIL_ON" $extra \
                 --source-url "https://github.com/${{ github.repository }}" --source-ref "${{ github.sha }}"
          code=$?
          set -e
          echo "result=$(jq -r .result "$RUNNER_TEMP/out/gate.json" 2>/dev/null || echo ERROR)" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/out/summary.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sbom-cve-gate-${{ inputs.name }}
          path: ${{ runner.temp }}/out
          if-no-files-found: warn
