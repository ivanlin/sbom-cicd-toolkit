# Reusable SBOM + CVE gate. Call it from any repo:
#   jobs:
#     gate:
#       uses: ivanlin/sbom-cicd-toolkit/.github/workflows/scan.yml@v1.0.2
#       with:
#         name: my-project
#         source: .
#         fail_on: CRITICAL
name: sbom-cve-gate (reusable)
on:
  workflow_call:
    inputs:
      name:
        type: string
        required: true
        description: "SBOM / artifact name"
      source:
        type: string
        default: "."
        description: "directory to scan, repo-relative"
      fail_on:
        type: string
        default: "CRITICAL"
        description: "CRITICAL | HIGH | MEDIUM | LOW | none"
      only_fixed:
        type: boolean
        default: false
      toolkit_image:
        type: string
        default: "ghcr.io/ivanlin/sbom-cicd-toolkit:1.0.2"
    outputs:
      result:
        value: ${{ jobs.gate.outputs.result }}
      toolkit_digest:
        value: ${{ jobs.gate.outputs.digest }}
jobs:
  gate:
    runs-on: ubuntu-latest
    # No `permissions:` block on purpose: a called workflow may not ask for more than its caller
    # grants, and the toolkit image is public, so neither packages:read nor a registry login is needed.
    outputs:
      result: ${{ steps.scan.outputs.result }}
      digest: ${{ steps.pull.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - id: pull
        name: Pull the pinned toolkit image and record its digest
        run: |
          docker pull "${{ inputs.toolkit_image }}"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "${{ inputs.toolkit_image }}")"
          echo "digest=$digest" | tee -a "$GITHUB_OUTPUT"
      - id: scan
        name: SBOM (CycloneDX+SPDX) + CVE scan (grype, trivy) + gate
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          extra=""; [ "${{ inputs.only_fixed }}" = "true" ] && extra="--only-fixed"
          set +e
          docker run --rm -e SBOMGATE_IMAGE_DIGEST="${{ steps.pull.outputs.digest }}" \
            -v "$GITHUB_WORKSPACE:/src:ro" -v "$RUNNER_TEMP/out:/out" "${{ inputs.toolkit_image }}" \
            scan --source "/src/${{ inputs.source }}" --name "${{ inputs.name }}" --out /out \
                 --fail-on "${{ inputs.fail_on }}" $extra
          code=$?
          set -e
          echo "result=$(jq -r .result "$RUNNER_TEMP/out/gate.json" 2>/dev/null || echo ERROR)" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/out/summary.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sbom-cve-gate-${{ inputs.name }}
          path: ${{ runner.temp }}/out
          if-no-files-found: warn
