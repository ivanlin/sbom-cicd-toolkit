# Release: multi-arch image -> GHCR, self-scan with the just-built image, keyless cosign sign +
# SBOM attestation, GitHub Release with the evidence attached. Triggered by tags vX.Y.Z.
# Key signing of the image (D2/D6: second signature with the mac mini key) is NOT done here — no
# private key ever reaches a CI runner. The run leaves out/release/KEY-SIGNING-TODO.md for the
# operator, who runs scripts/sign-toolkit-image.sh <version> on the mac mini (docs/SIGNING.md).
name: release
on:
  push: { tags: [ "v*" ] }
  workflow_dispatch:
env:
  IMAGE: ghcr.io/${{ github.repository }}
permissions: { contents: write, packages: write, id-token: write }
jobs:
  build-push-selfscan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: ver
        name: Version comes from VERSION; a tag must match it
        run: |
          v="$(tr -d '[:space:]' < VERSION)"; echo "version=$v" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then [ "$GITHUB_REF_NAME" = "v$v" ] || { echo "tag $GITHUB_REF_NAME != VERSION $v" >&2; exit 1; }; fi
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=${{ steps.ver.outputs.version }},suffix=-sha-${{ github.sha }},enable=false
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          build-args: |
            TOOLKIT_VERSION=${{ steps.ver.outputs.version }}
            VCS_REF=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Record the multi-arch manifest (index digest + per-arch digests)
        run: |
          mkdir -p out/release
          docker buildx imagetools inspect "$IMAGE@${{ steps.build.outputs.digest }}" | tee out/release/manifest.txt
          docker buildx imagetools inspect "$IMAGE@${{ steps.build.outputs.digest }}" --raw > out/release/manifest.json
          echo "${{ steps.build.outputs.digest }}" > out/release/index-digest.txt
          jq -r '.manifests[] | "\(.platform.os)/\(.platform.architecture) \(.digest)"' out/release/manifest.json | tee out/release/per-arch-digests.txt
      - name: Self-scan — the image scans its own source tree AND its own image tar
        id: selfscan
        run: |
          ref="$IMAGE@${{ steps.build.outputs.digest }}"
          docker pull --platform linux/amd64 "$ref"
          docker save "$ref" -o "$RUNNER_TEMP/self.tar"
          mkdir -p out/self-scan; set +e
          # Self-scan threshold is CRITICAL on purpose (documented exception, see docs/RELEASING.md 1.1.0 and policy/gate-policy.md):
          # the HIGHs in this image are Go stdlib / x/net CVEs compiled into the pinned upstream scanner binaries. Projects use HIGH.
          docker run --rm -e SBOMGATE_IMAGE_DIGEST="${{ steps.build.outputs.digest }}" \
            -v "$PWD:/src:ro" -v "$PWD/out/self-scan:/out" -v "$RUNNER_TEMP/self.tar:/in/self.tar:ro" "$ref" \
            scan --source /src --exclude './examples/**' --image-tar /in/self.tar --name sbom-cicd-toolkit --label "${{ steps.ver.outputs.version }}" --out /out --fail-on CRITICAL \
                 --source-url "https://github.com/${{ github.repository }}" --source-ref "${{ github.ref_name }}"
          code=$?; set -e
          cat out/self-scan/summary.md >> "$GITHUB_STEP_SUMMARY"
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          exit $code
      - name: Pinned tools check (check-tools vs tools.lock) + tool versions, both architectures
        run: |
          set -o pipefail
          # Run each architecture by its OWN manifest digest (per-arch-digests.txt): pulling the index digest
          # twice with different --platform values fails with "cannot overwrite digest" (1.2.0 release run).
          for p in amd64 arm64; do
            d="$(awk -v a="linux/$p" '$1==a{print $2}' out/release/per-arch-digests.txt)"
            [ -n "$d" ] || { echo "::error::no linux/$p manifest in per-arch-digests.txt"; exit 1; }
            docker run --rm --platform "linux/$p" "$IMAGE@$d" check-tools 2>&1 | tee "out/release/check-tools.linux-$p.txt"
            docker run --rm --platform "linux/$p" "$IMAGE@$d" tools | tee "out/release/tools.linux-$p.json"
          done
          cp out/release/check-tools.linux-amd64.txt out/release/check-tools.txt
          cp out/release/tools.linux-amd64.json out/release/tools.json
      - name: Trusted keys baked into the image (verify-toolkit / verify-release trust these)
        run: |
          ref="$IMAGE@${{ steps.build.outputs.digest }}"
          docker run --rm --platform linux/amd64 --entrypoint cat "$ref" /opt/sbom-cicd-toolkit/trusted-keys.yaml > out/release/trusted-keys.image.yaml
          cmp out/release/trusted-keys.image.yaml policy/trusted-keys.yaml || { echo "::error::image trusted-keys.yaml differs from policy/trusted-keys.yaml"; exit 1; }
          cp policy/trusted-keys.yaml out/release/trusted-keys.yaml
          n="$(docker run --rm --platform linux/amd64 --entrypoint yq "$ref" '[.keys[] | select(.status == "active")] | length' /opt/sbom-cicd-toolkit/trusted-keys.yaml)"
          echo "active trusted keys in this release: $n" | tee out/release/trusted-keys.count.txt
          [ "$n" -gt 0 ] || echo "::warning::policy/trusted-keys.yaml has no active key: verify-toolkit / verify-release in this image will reject every signature"
      - uses: sigstore/cosign-installer@v3
      - name: Keyless sign the index digest + attest the image SBOM (Sigstore / Rekor)
        run: |
          ref="$IMAGE@${{ steps.build.outputs.digest }}"
          cosign sign --yes "$ref" 2>&1 | tee out/release/cosign-sign.log
          cosign attest --yes --type cyclonedx --predicate out/self-scan/sbom/sbom-cicd-toolkit.image.cdx.json "$ref" 2>&1 | tee out/release/cosign-attest.log
          cosign verify "$ref" --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com -o text 2>&1 | tee out/release/cosign-verify.log
      - name: Operator TODO — key signature of the image happens on the mac mini, never here (D2)
        run: |
          v="${{ steps.ver.outputs.version }}"; d="${{ steps.build.outputs.digest }}"
          cat > out/release/KEY-SIGNING-TODO.md <<TODO
          # Key-sign sbom-cicd-toolkit $v (operator, mac mini)

          The keyless (Sigstore) signature and SBOM attestation were made by this workflow.
          The **key** signature (D6, the path consumers verify by default) is NOT made in CI (D2).
          Until it exists, \`verify-toolkit\` rejects this image and consumers must not pin it.

          Image (pin this exact ref): \`$IMAGE@$d\`

          On the mac mini, in a checkout of tag v$v:

          \`\`\`bash
          git fetch --tags && git checkout v$v
          scripts/sign-toolkit-image.sh $v            # key from \$SBOMSIGN_KEY, or --key <URI>
          docker run --rm $IMAGE@$d verify-toolkit --image $IMAGE@$d   # must print PASS
          \`\`\`

          Then publish the digest to consumers (templates / sssf.config.yaml / bitbucket-pipelines.yml).
          See docs/SIGNING.md and docs/RELEASING.md.
          TODO
          cat out/release/KEY-SIGNING-TODO.md >> "$GITHUB_STEP_SUMMARY"
      - name: Native bundle (same tools.lock, for machines without Docker)
        run: |
          # bin/ carries sbomgate + sbomsign, policy/ carries trusted-keys.yaml; cosign itself is
          # fetched by install/ from the sha256 pinned in tools.lock (like syft/grype/trivy/yq/jq).
          for f in bin/sbomgate bin/sbomsign policy/trusted-keys.yaml; do test -f "$f" || { echo "::error::missing $f"; exit 1; }; done
          grep -q '^COSIGN_VERSION=' tools.lock || { echo "::error::tools.lock has no COSIGN_VERSION"; exit 1; }
          tar -czf "out/release/sbom-cicd-toolkit-${{ steps.ver.outputs.version }}-native.tar.gz" VERSION tools.lock bin install templates policy scripts docs
          (cd out/release && sha256sum -- *.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: release-evidence, path: out }
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          cp out/self-scan/gate.json out/release/self-scan.gate.json
          cp out/self-scan/summary.md out/release/self-scan.summary.md
          cp out/self-scan/sbom/*.json out/release/
          gh release create "$GITHUB_REF_NAME" --title "sbom-cicd-toolkit $GITHUB_REF_NAME" \
            --notes "Image: \`$IMAGE:${{ steps.ver.outputs.version }}\` · pin: \`$IMAGE@${{ steps.build.outputs.digest }}\` · per-arch digests in manifest.txt · self-scan gate: $(jq -r .result out/self-scan/gate.json) · key signature: pending operator (KEY-SIGNING-TODO.md) — do not pin before verify-toolkit passes" \
            out/release/*
